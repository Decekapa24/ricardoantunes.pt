<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Currículo Interativo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: coluna única editorial com nav fixa; experiência como "git log" de carreira — pessoas + código */
:root{
  --bg:#F3F5F4; --surface:#FFFFFF; --ink:#13201D; --muted:#5B6A66; --line:#D9E0DD;
  --accent:#0E6B5C; --accent-soft:#DCEDE8; --warm:#B8691A; --warm-soft:#F6E7D6;
  --ph:#B8691A;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1614; --surface:#16201D; --ink:#E6EEEB; --muted:#93A39E; --line:#26332F;
  --accent:#4FC2A9; --accent-soft:#173A33; --warm:#E6A35C; --warm-soft:#3A2A18; --ph:#E6A35C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1614; --surface:#16201D; --ink:#E6EEEB; --muted:#93A39E; --line:#26332F;
  --accent:#4FC2A9; --accent-soft:#173A33; --warm:#E6A35C; --warm-soft:#3A2A18; --ph:#E6A35C; color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.ph{color:var(--ph);border-bottom:1.5px dashed var(--ph)}
.mono{font-family:var(--f-mono);font-size:.82rem}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1}
.label{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* Nav */
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;gap:16px;padding-block:10px}
.brand{font-family:var(--f-mono);font-weight:500;font-size:.85rem;color:var(--ink);text-decoration:none;white-space:nowrap}
.brand b{color:var(--accent)}
.links{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.links a{font-size:.85rem;color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:6px;white-space:nowrap}
.links a.on,.links a:hover{color:var(--ink);background:var(--accent-soft)}
.theme-btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:6px 10px;cursor:pointer;font-family:var(--f-mono);font-size:.75rem}

/* Hero */
header.hero{padding-block:56px 40px}
.hero-grid{display:grid;grid-template-columns:auto 1fr;gap:32px;align-items:center}
.avatar{width:132px;height:132px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:2.6rem;color:var(--accent);border:3px solid var(--accent);object-fit:cover;object-position:50% 30%}
.hero h1{font-size:clamp(2.4rem,6vw,4rem);font-weight:800;letter-spacing:-.02em}
.role{font-family:var(--f-display);font-size:clamp(1.1rem,2.4vw,1.4rem);font-weight:500;color:var(--muted);margin-top:8px}
.role em{font-style:normal;color:var(--accent)}
.summary{max-width:62ch;margin-top:20px}
.meta{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:20px;color:var(--muted);font-size:.9rem}

/* Balance */
.balance{margin-top:36px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 22px}
.balance-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.balance h3{font-size:1.05rem}
.bar{position:relative;height:12px;border-radius:99px;margin-top:18px;background:var(--warm-soft);overflow:hidden}
.bar span{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:99px;transition:width .3s}
.bar-legend{display:flex;justify-content:space-between;margin-top:10px;font-size:.9rem}
.bar-legend b{font-variant-numeric:tabular-nums}
.balance input{width:100%;margin-top:14px;accent-color:var(--accent)}
.balance p{margin:10px 0 0;color:var(--muted);font-size:.9rem;min-height:3em}

/* Sections */
section{padding-block:48px;border-top:1px solid var(--line);scroll-margin-top:60px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.sec-head h2{font-size:clamp(1.6rem,3.5vw,2.2rem);font-weight:700}

/* Impact */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
.stat .n{font-family:var(--f-display);font-weight:800;font-size:2rem;color:var(--accent);font-variant-numeric:tabular-nums}
.stat .t{font-size:.88rem;color:var(--muted);margin-top:4px}

/* Experience log */
.log{display:grid;gap:0;position:relative}
.commit{display:grid;grid-template-columns:22px 1fr;gap:16px}
.rail{position:relative;display:flex;justify-content:center}
.rail::before{content:"";position:absolute;top:0;bottom:0;width:2px;background:var(--line)}
.commit:first-child .rail::before{top:14px}
.commit:last-child .rail::before{bottom:auto;height:14px}
.dot{position:relative;margin-top:8px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:3px solid var(--accent)}
.commit.current .dot{background:var(--accent)}
.c-body{padding-bottom:28px;min-width:0}
.c-btn{all:unset;cursor:pointer;display:block;width:100%;border-radius:10px;padding:4px 0}
.c-meta{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.hash{font-family:var(--f-mono);font-size:.78rem;color:var(--warm);background:var(--warm-soft);padding:1px 7px;border-radius:4px}
.tag{font-family:var(--f-mono);font-size:.72rem;color:var(--accent);border:1px solid var(--accent);padding:0 6px;border-radius:4px}
.c-head{display:flex;gap:16px;align-items:center}
.c-txt{min-width:0;flex:1}
.logo{flex:none;width:96px;height:56px;background:#FFFFFF;border:1px solid var(--line);border-radius:10px;display:grid;place-items:center;padding:8px 10px}
.logo img{max-width:100%;max-height:100%;object-fit:contain;display:block}
@media (max-width:480px){.c-head{flex-direction:column;align-items:flex-start;gap:10px}.logo{width:84px;height:46px}}
.c-title{font-family:var(--f-display);font-size:1.3rem;font-weight:700;margin-top:6px}
.c-org{color:var(--muted)}
.chev{display:inline-block;transition:transform .2s;color:var(--muted);margin-left:6px}
.c-btn[aria-expanded="true"] .chev{transform:rotate(90deg)}
.c-detail{margin-top:12px;display:grid;gap:14px}
.c-detail ul{margin:0;padding-left:1.1em}
.c-detail li{margin-bottom:6px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.box .label{margin-bottom:6px}
.stack{display:flex;flex-wrap:wrap;gap:6px}
.stack span{font-family:var(--f-mono);font-size:.75rem;background:var(--bg);border:1px solid var(--line);padding:2px 8px;border-radius:4px}
.expand-all{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:6px 12px;cursor:pointer;font-size:.85rem}

/* Skills */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 14px;border-radius:99px;cursor:pointer;font-size:.88rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.skills{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 28px}
.skill{display:grid;grid-template-columns:10px 1fr;gap:12px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
.sk-dot{width:10px;height:10px;border-radius:50%;margin-top:7px}
.skill[data-cat="lid"] .sk-dot{background:var(--accent)}.skill[data-cat="tec"] .sk-dot{background:var(--warm)}.skill[data-cat="ges"] .sk-dot{background:var(--muted)}
.sk-n{display:block;font-weight:600}.sk-w{display:block;font-size:.88rem;color:var(--muted)}
.skill .lvl{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.meter{grid-column:1/-1;height:5px;background:var(--line);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px}
.skill[data-cat="lid"] .meter i{background:var(--accent)}
.skill[data-cat="tec"] .meter i{background:var(--warm)}
.skill[data-cat="ges"] .meter i{background:var(--muted)}
.cat-key{font-size:.75rem;font-family:var(--f-mono);color:var(--muted)}

/* Principles */
.principles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pr{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;cursor:pointer;text-align:left;color:var(--ink);font:inherit;display:flex;flex-direction:column;gap:8px}
.pr h3{font-size:1.1rem}
.pr .ex{color:var(--muted);font-size:.9rem}
.pr .more{font-size:.9rem;border-top:1px dashed var(--line);padding-top:10px}
.pr .hint{font-family:var(--f-mono);font-size:.72rem;color:var(--accent);margin-top:auto}

/* Education */
.two{display:grid;grid-template-columns:3fr 2fr;gap:36px}
.two>div{min-width:0}
.edu-item{padding:14px 0;border-bottom:1px solid var(--line)}
.edu-item h3{font-size:1.05rem}
.edu-item .sub{color:var(--muted);font-size:.9rem}
.lang{display:grid;grid-template-columns:1fr auto;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.cefr{display:flex;gap:3px}
.cefr span{font-family:var(--f-mono);font-size:.68rem;width:26px;text-align:center;padding:2px 0;border-radius:3px;background:var(--line);color:var(--muted)}
.cefr span.on{background:var(--accent);color:var(--bg)}

.hobbies{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:auto auto;gap:12px}
.hb{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:10px;min-width:0}
.hb p{margin:0}
.hb-main{grid-row:span 2}
.hb-top{display:flex;align-items:center;gap:12px}
.hb-top h3{font-size:1.3rem}
.hb-ic{width:34px;height:34px;flex:none;fill:none;stroke:var(--accent);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.hb-ic .hb-d{fill:var(--warm);stroke:none}.hb-ic .hb-x{stroke:var(--warm)}
.hb-main .label{margin-top:6px}
.hb-chips{display:flex;flex-wrap:wrap;gap:8px}
.hb-chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer;font-family:var(--f-display);font-weight:700;font-size:.98rem}
.hb-chip:hover{border-color:var(--accent)}
.hb-chip[aria-pressed="true"]{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.hb-detail{color:var(--muted);font-size:.92rem;min-height:2.8em}
.hb-tags{display:flex;flex-wrap:wrap;gap:6px}
.hb-tags span{font-family:var(--f-mono);font-size:.76rem;color:var(--warm);background:var(--warm-soft);padding:3px 9px;border-radius:4px}
@media (max-width:760px){.hobbies{grid-template-columns:1fr}.hb-main{grid-row:auto}}
/* Contact */
.contact{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.ct{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;min-width:0}
.ct .v{font-weight:500;overflow-wrap:anywhere;user-select:all}
.copy{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:6px 10px;cursor:pointer;font-family:var(--f-mono);font-size:.72rem;white-space:nowrap}
.copy.ok{background:var(--accent);color:var(--bg);border-color:var(--accent)}

/* Gate: mini-jogo de entrada (visual próprio, sempre escuro) */
body.locked{overflow:hidden}
#gate{position:fixed;inset:0;z-index:30;background:#0B1210;color:#E6EEEB;overflow-y:auto;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);transition:opacity .5s, transform .5s}
#gate.out{opacity:0;transform:scale(1.03);pointer-events:none}
.g-inner{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.g-inner h2{font-family:var(--f-display);font-weight:800;font-size:clamp(1.6rem,5vw,2.3rem);color:#E6EEEB}
.g-inner h2 em{font-style:normal;color:#4FC2A9}
.g-sub{color:#93A39E;margin:0;max-width:48ch}
.g-hud{display:flex;justify-content:space-between;width:100%;font-family:var(--f-mono);font-size:.8rem;color:#93A39E}
.g-hud b{color:#E6A35C;font-variant-numeric:tabular-nums}
.g-stage{position:relative;width:100%}
#game{display:block;width:100%;height:auto;border-radius:10px;background:#0F1915;touch-action:none}
.g-msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(11,18,16,.86);border-radius:10px;padding:16px}
.g-msg p{margin:0;font-family:var(--f-display);font-size:1.4rem;font-weight:700}
.g-btn{border:0;background:#4FC2A9;color:#0B1210;font-family:var(--f-mono);font-weight:500;font-size:.9rem;padding:10px 18px;border-radius:8px;cursor:pointer}
.g-btn:focus-visible{outline:2px solid #E6A35C;outline-offset:3px}
.g-skip{background:none;border:0;color:#93A39E;font-family:var(--f-mono);font-size:.8rem;cursor:pointer;text-decoration:underline;padding:6px}
.g-skip:hover{color:#E6EEEB}
.g-msub{color:#B9C6C2;font-size:.92rem;max-width:44ch}
.g-acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.g-btn.alt{background:transparent;color:#E6EEEB;border:1px solid #4FC2A9}
.g-btn:disabled{opacity:.4;cursor:default}
.g-ctrl{display:grid;grid-template-columns:1fr 1fr auto;gap:12px 20px;width:100%;align-items:end;text-align:left}
.g-ctrl label{display:flex;flex-direction:column;gap:4px;font-family:var(--f-mono);font-size:.78rem;color:#93A39E}
.g-ctrl label b{color:#E6EEEB;font-variant-numeric:tabular-nums;font-weight:500;margin-left:6px}
.g-ctrl input{width:100%;accent-color:#4FC2A9}
.g-fb{min-height:1.4em;font-family:var(--f-mono);font-size:.82rem;color:#E6A35C}
.g-skip{border:1px solid #26332F!important;border-radius:8px;text-decoration:none!important;color:#E6EEEB!important;padding:10px 16px!important}
.g-skip:hover{border-color:#4FC2A9!important}
#game{cursor:crosshair}
@media (max-width:520px){.g-ctrl{grid-template-columns:1fr 1fr}.g-ctrl .g-btn{grid-column:1/-1}}

footer{padding-block:32px 48px;border-top:1px solid var(--line);color:var(--muted);font-size:.85rem}
.note{background:var(--warm-soft);border:1px dashed var(--warm);border-radius:10px;padding:12px 16px;font-size:.88rem;margin-top:20px}

@media (max-width:760px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .principles,.skills,.two,.contact,.split{grid-template-columns:1fr}
  .hero-grid{grid-template-columns:1fr;gap:20px}
  .avatar{width:96px;height:96px;font-size:2rem}
  header.hero{padding-block:36px 28px}
}

/* Seletor de idioma */
.lang-sw{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex:none}
.lang-sw button{border:0;background:var(--surface);color:var(--muted);font-family:var(--f-mono);font-size:.72rem;padding:6px 8px;cursor:pointer}
.lang-sw button+button{border-left:1px solid var(--line)}
.lang-sw button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.g-top{display:flex;justify-content:space-between;align-items:center;width:100%;gap:12px}
#gate .lang-sw{border-color:#26332F}
#gate .lang-sw button{background:#16201D;color:#93A39E}
#gate .lang-sw button+button{border-left-color:#26332F}
#gate .lang-sw button[aria-pressed="true"]{background:#4FC2A9;color:#0B1210}
</style>

<div id="gate" role="dialog" aria-modal="true" aria-labelledby="gTitle">
  <div class="g-inner">
    <div class="g-top">
      <span class="label" style="color:#93A39E" data-i="g_eyebrow"></span>
      <div class="lang-sw" role="group" aria-label="Idioma / Language"><button type="button" data-lang="pt">PT</button><button type="button" data-lang="en">EN</button><button type="button" data-lang="es">ES</button></div>
    </div>
    <h2 id="gTitle" data-ih="g_title"></h2>
    <div class="g-hud"><span><span data-i="g_lvl"></span> <b id="gLvl">1/5</b></span><span><span data-i="g_saved"></span> <b id="gSaved">0</b></span><span><span data-i="g_tries"></span> <b id="gTries">0</b></span></div>
    <div class="g-stage">
      <canvas id="game" width="600" height="360" data-ia="aria-label:g_aria"></canvas>
      <div class="g-msg" id="gMsg">
        <p id="gMsgT"></p>
        <span class="g-msub" id="gMsgS"></span>
        <div class="g-acts"><button class="g-btn" id="gMain" type="button"></button><button class="g-btn alt" id="gEnter" type="button" data-i="g_enter"></button></div>
      </div>
    </div>
    <div class="g-ctrl">
      <label for="gAng"><span data-i="g_ang"></span> <b id="gAngV">45°</b><input type="range" id="gAng" min="10" max="80" value="45"></label>
      <label for="gPow"><span data-i="g_pow"></span> <b id="gPowV">50%</b><input type="range" id="gPow" min="0" max="100" value="50"></label>
      <button class="g-btn" id="gFire" type="button" data-i="g_fire"></button>
    </div>
    <div class="g-fb" id="gFb" aria-live="polite"></div>
    <button class="g-skip" id="gSkip" type="button" data-i="g_skip"></button>
  </div>
</div>

<nav data-ia="aria-label:n_aria">
  <div class="wrap">
    <a class="brand" href="#topo"><b>~/</b>cv</a>
    <div class="links">
      <a href="#impacto" data-i="n_imp"></a>
      <a href="#experiencia" data-i="n_exp"></a>
      <a href="#competencias" data-i="n_sk"></a>
      <a href="#lideranca" data-i="n_lead"></a>
      <a href="#formacao" data-i="n_edu"></a>
      <a href="#hobbies" data-i="n_hob"></a>
      <a href="#contacto" data-i="n_ct"></a>
    </div>
    <div class="lang-sw" role="group" aria-label="Idioma / Language"><button type="button" data-lang="pt">PT</button><button type="button" data-lang="en">EN</button><button type="button" data-lang="es">ES</button></div>
    <button class="theme-btn" id="themeBtn" type="button" data-i="n_theme" data-ia="aria-label:n_theme_a"></button>
  </div>
</nav>

<main id="topo">
<header class="hero">

  $("#barFill").style.width=v+"%";$("#pctL").textContent=v+"%";$("#pctT").textContent=(100-v)+"%";
  $("#balanceText").textContent=BAL[LANG].find(b=>v>=b[0])[1];
}
$("#balance").addEventListener("input",e=>setBal(+e.target.value));

function renderAll(){
  applyStatic();renderExp();renderEdu();renderSkills();renderPrinc();renderLangs();renderGame();setBal(+$("#balance").value);
  listeners.forEach(f=>f());
}
document.querySelectorAll(".lang-sw button").forEach(b=>b.addEventListener("click",()=>{
  LANG=b.dataset.lang;try{localStorage.setItem("cv-lang",LANG)}catch(e){}renderAll();
}));

// Copiar
document.querySelectorAll(".copy").forEach(b=>b.addEventListener("click",()=>{
  const v=b.parentElement.querySelector(".v");
  const reset=()=>{b.textContent=T("c_copy");b.classList.remove("ok")};
  const done=()=>{b.textContent=T("c_copied");b.classList.add("ok");setTimeout(reset,1600)};
  const sel=()=>{const r=document.createRange();r.selectNodeContents(v);const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent=T("c_sel");setTimeout(reset,1600)};
  try{navigator.clipboard.writeText(v.textContent.trim()).then(done,sel)}catch(e){sel()}
}));

// Tema
$("#themeBtn").addEventListener("click",()=>{
  const r=document.documentElement,cur=r.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
  r.dataset.theme=cur==="dark"?"light":"dark";try{localStorage.setItem("cv-theme",r.dataset.theme)}catch(e){}
});
try{const t=localStorage.getItem("cv-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}

// Nav ativa
const navL=[...document.querySelectorAll(".links a")];
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)navL.forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#"+e.target.id))}),{rootMargin:"-40% 0px -55% 0px"});
document.querySelectorAll("section").forEach(s=>io.observe(s));

// ===== Jogo de entrada: lançamento =====
(function(){
  const cv=$("#game"),ctx=cv.getContext("2d"),gate=$("#gate"),msg=$("#gMsg"),msgT=$("#gMsgT"),msgS=$("#gMsgS"),
        bMain=$("#gMain"),bEnter=$("#gEnter"),angI=$("#gAng"),powI=$("#gPow"),angV=$("#gAngV"),powV=$("#gPowV"),fire=$("#gFire"),fb=$("#gFb");
  document.body.classList.add("locked");
  const WORLD=40,G=9.8,LX=3,LY=1.6,VMIN=6,VMAX=22,ASPECT=.6;
  const LEVELS=[
    {tx:20,w:3.4,move:0,speed:0,wind:null,preview:1},
    {tx:31,w:3,move:0,speed:0,wind:null,preview:.4},
    {tx:26,w:2.8,move:5,speed:.8,wind:null,preview:.2},
    {tx:29,w:2.6,move:2.5,speed:.7,wind:[1.2,2.4],preview:0},
    {tx:27,w:2.1,move:6,speed:1.3,wind:[1.8,3.2],preview:0}];
  let cur=null,lvl=0,saved=0,tries=0,state="intro",L=LEVELS[0],wind=0,proj=null,trail=[],parts=[],landed=null,last=0,raf,lvlT=0,drag=null,fbTimer;
  const fmt=n=>n.toFixed(1).replace(".",FN[LANG].dec);
  const tgtX=()=>L.tx+L.move*Math.sin(lvlT*L.speed);
  const vel=()=>VMIN+(VMAX-VMIN)*(+powI.value)/100;

  function setLevel(i){
    lvl=i;L=LEVELS[i];tries=0;lvlT=0;proj=null;trail=[];landed=null;
    wind=L.wind?(Math.random()<.5?-1:1)*(L.wind[0]+Math.random()*(L.wind[1]-L.wind[0])):0;
    hud();
  }
  function hud(){
    $("#gLvl").textContent=`${lvl+1}/5`;$("#gSaved").textContent=saved;$("#gTries").textContent=tries;
    angV.textContent=angI.value+"°";powV.textContent=powI.value+"%";
    fire.disabled=state!=="aim";
  }
  function say(t){fb.textContent=t;clearTimeout(fbTimer);fbTimer=setTimeout(()=>fb.textContent="",2600);}
  function texts(k){
    if(k==="intro")return[T("g_intro_t"),T("g_intro_s"),T("g_start"),true];
    if(k==="hit")return[T("g_hit_t"),FN[LANG].hit(lvl+1,tries)+" "+HINTS[LANG][lvl+1],T("g_next"),true];
    return[T("g_final_t"),T("g_final_s"),T("g_enter"),false];
  }
  function paint(){if(!cur)return;const[t,sub,main,enter]=texts(cur);msgT.textContent=t;msgS.textContent=sub;bMain.textContent=main;bEnter.hidden=!enter;}
  function show(k){cur=k;paint();msg.hidden=false;bMain.focus();}

  function launch(){
    if(state!=="aim")return;
    const a=(+angI.value)*Math.PI/180,v=vel();
    proj={x:LX+Math.cos(a)*1.6,y:LY+Math.sin(a)*1.6,vx:v*Math.cos(a),vy:v*Math.sin(a),rot:0};
    trail=[];tries++;state="fly";hud();
  }
  function update(dt){
    lvlT+=dt;
    if(state==="fly"&&proj){
      const steps=4,h=dt*1.5/steps;
      for(let i=0;i<steps;i++){
        proj.vx+=wind*.6*h;proj.vy-=G*h;proj.x+=proj.vx*h;proj.y+=proj.vy*h;proj.rot+=7*h;
        if(proj.y<=0){proj.y=0;return land();}
      }
      trail.push([proj.x,proj.y]);
      if(proj.x>WORLD+3||proj.x<-3){state="miss";say(T("g_out"));setTimeout(()=>{state="aim";proj=null;hud();},900);}
    }
    if(landed)landed.t+=dt;
    parts.forEach(p=>{p.vy-=6*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;});parts=parts.filter(p=>p.life>0);
  }
  function land(){
    const d=proj.x-tgtX();
    if(Math.abs(d)<=L.w/2){
      state="hit";saved++;landed={x:proj.x,off:d,t:0};proj=null;hud();
      for(let i=0;i<60;i++)parts.push({x:landed.x,y:1,vx:(Math.random()-.5)*12,vy:4+Math.random()*8,life:1.2+Math.random(),c:["#E6A35C","#4FC2A9","#E6EEEB","#E5484D"][i%4]});
      setTimeout(()=>{
        if(lvl===4){state="final";show("final");}
        else show("hit");
      },1300);
    }else{
      state="miss";
      say(d<0?FN[LANG].short(fmt(-d-L.w/2)):FN[LANG].long(fmt(d-L.w/2)));
      setTimeout(()=>{if(state==="miss"){state="aim";proj=null;trail=[];hud();}},900);
    }
  }

  // ---- desenho
  let S=15,GY=0;
  function wx(x){return x*S} function wy(y){return GY-y*S}
  function person(x,y,rot,col,glow,scale=1){
    ctx.save();ctx.translate(wx(x),wy(y));ctx.rotate(-rot);ctx.scale(scale,scale);
    const u=S;ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=Math.max(2,u*.13);ctx.lineCap="round";
    if(glow){ctx.shadowColor="#E6A35C";ctx.shadowBlur=u*.9;}
    ctx.beginPath();ctx.arc(0,-u*1.35,u*.32,0,7);ctx.fill();
    ctx.beginPath();ctx.moveTo(0,-u*1.0);ctx.lineTo(0,-u*.35);ctx.stroke();
    const arm=glow?-.9:-.3;
    ctx.beginPath();ctx.moveTo(-u*.5,-u*(.75-arm*.4));ctx.lineTo(0,-u*.85);ctx.lineTo(u*.5,-u*(.75-arm*.4));ctx.stroke();
    ctx.beginPath();ctx.moveTo(-u*.32,0);ctx.lineTo(0,-u*.35);ctx.lineTo(u*.32,0);ctx.stroke();
    ctx.restore();
  }
  function star(x,y,r){ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.45:r;ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}ctx.closePath();ctx.fill();}
  function draw(ts){
    const cw=cv.clientWidth,ch=cw*ASPECT;S=cw/WORLD;GY=ch-S*1.4;
    const g=ctx.createLinearGradient(0,0,0,ch);g.addColorStop(0,"#0B1210");g.addColorStop(1,"#14261F");
    ctx.fillStyle=g;ctx.fillRect(0,0,cw,ch);
    // vento: riscos no céu
    if(wind){ctx.strokeStyle="rgba(230,238,235,.13)";ctx.lineWidth=1.5;
      for(let i=0;i<14;i++){const sp=wind*18,y=(i*37%Math.floor(GY*0.8))+12,x=((ts/1000*sp*S/6+i*97)%(cw+60)+cw+60)%(cw+60)-30;
        ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-Math.sign(wind)*S*1.4,y);ctx.stroke();}}
    // chão e régua em metros
    ctx.fillStyle="#173A33";ctx.fillRect(0,GY,cw,ch-GY);
    ctx.fillStyle="#4FC2A9";ctx.font=`${Math.max(9,S*.55)}px "JetBrains Mono", monospace`;ctx.textAlign="center";
    for(let m=5;m<WORLD;m+=5){ctx.globalAlpha=.55;ctx.fillRect(wx(m)-.5,GY,1,S*.35);ctx.fillText(m+" m",wx(m),GY+S*1.05);}
    ctx.globalAlpha=1;
    // alvo
    const tx=tgtX(),tw=L.w*S;
    ctx.fillStyle="#E5484D";ctx.beginPath();ctx.ellipse(wx(tx),GY,tw/2,S*.32,0,0,7);ctx.fill();
    ctx.fillStyle="#E6EEEB";ctx.beginPath();ctx.ellipse(wx(tx),GY,tw/3,S*.21,0,0,7);ctx.fill();
    ctx.fillStyle="#E6A35C";ctx.beginPath();ctx.ellipse(wx(tx),GY,tw/6,S*.11,0,0,7);ctx.fill();
    ctx.strokeStyle="#93A39E";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(wx(tx+L.w/2+.3),GY);ctx.lineTo(wx(tx+L.w/2+.3),GY-S*3);ctx.stroke();
    ctx.fillStyle="#E6A35C";ctx.beginPath();ctx.moveTo(wx(tx+L.w/2+.3),GY-S*3);ctx.lineTo(wx(tx+L.w/2+1.8),GY-S*2.6);ctx.lineTo(wx(tx+L.w/2+.3),GY-S*2.2);ctx.fill();
    // lançador
    const a=(+angI.value)*Math.PI/180;
    ctx.fillStyle="#26332F";ctx.beginPath();ctx.moveTo(wx(LX-1.2),GY);ctx.lineTo(wx(LX-.4),wy(LY));ctx.lineTo(wx(LX+.4),wy(LY));ctx.lineTo(wx(LX+1.2),GY);ctx.fill();
    ctx.strokeStyle="#4FC2A9";ctx.lineWidth=S*.28;ctx.lineCap="round";
    ctx.beginPath();ctx.moveTo(wx(LX),wy(LY));ctx.lineTo(wx(LX+Math.cos(a)*1.6),wy(LY+Math.sin(a)*1.6));ctx.stroke();
    ctx.fillStyle="#4FC2A9";ctx.beginPath();ctx.arc(wx(LX),wy(LY),S*.3,0,7);ctx.fill();
    // pontaria
    if(state==="aim"&&L.preview>0){
      let x=LX+Math.cos(a)*1.6,y=LY+Math.sin(a)*1.6,vx=vel()*Math.cos(a),vy=vel()*Math.sin(a),pts=[];
      for(let i=0;i<400&&y>0;i++){vx+=wind*.6*.03;vy-=G*.03;x+=vx*.03;y+=vy*.03;pts.push([x,y]);}
      const n=Math.floor(pts.length*L.preview);ctx.fillStyle="rgba(230,238,235,.55)";
      for(let i=0;i<n;i+=3){ctx.beginPath();ctx.arc(wx(pts[i][0]),wy(pts[i][1]),Math.max(1.5,S*.09),0,7);ctx.fill();}
    }
    // rasto
    ctx.fillStyle="rgba(79,194,169,.45)";
    trail.forEach((p,i)=>{if(i%2)return;ctx.beginPath();ctx.arc(wx(p[0]),wy(p[1]),Math.max(1.2,S*.07),0,7);ctx.fill();});
    // pessoa
    if(state==="aim"||state==="intro")person(LX+Math.cos(a)*1.6,LY+Math.sin(a)*1.6,0,"#E6EEEB",false,.8);
    else if(proj)person(proj.x,proj.y,proj.rot,"#E6EEEB",false,.8);
    if(landed){
      const k=Math.min(1,landed.t/0.6),sc=.8+.35*k;
      person(tgtX()+landed.off,0,0,k<1?"#E6EEEB":"#E6A35C",k>=.5,sc);
      if(k>=1){ctx.fillStyle="#E6A35C";star(wx(tgtX()+landed.off),wy(0)-S*2.6*sc,S*.5+Math.sin(ts/200)*S*.06);}
    }
    parts.forEach(p=>{ctx.fillStyle=p.c;ctx.globalAlpha=Math.min(1,p.life);ctx.fillRect(wx(p.x),wy(p.y),S*.25,S*.25);});ctx.globalAlpha=1;
    // indicador de vento
    ctx.textAlign="right";ctx.font=`${Math.max(10,S*.6)}px "JetBrains Mono", monospace`;
    ctx.fillStyle=wind?"#E6EEEB":"#93A39E";
    ctx.fillText(wind?`${T("g_wind")} ${fmt(Math.abs(wind))} m/s ${wind>0?"→":"←"}`:T("g_nowind"),cw-S*.6,S*1.2);
    if(L.move){ctx.fillStyle="#93A39E";ctx.fillText(T("g_moving"),cw-S*.6,S*2.1);}
  }
  function loop(ts){
    const dt=Math.min((ts-(last||ts))/1000,.05);last=ts;
    if(state!=="intro")update(dt);
    draw(ts);raf=requestAnimationFrame(loop);
  }
  function size(){const w=cv.clientWidth||560,d=window.devicePixelRatio||1;cv.width=Math.round(w*d);cv.height=Math.round(w*ASPECT*d);cv.style.height=(w*ASPECT)+"px";ctx.setTransform(d,0,0,d,0,0);}
  function unlock(){
    state="done";cancelAnimationFrame(raf);gate.classList.add("out");document.body.classList.remove("locked");
    setTimeout(()=>{gate.hidden=true;},500);window.scrollTo(0,0);
  }

  bMain.addEventListener("click",()=>{
    if(state==="final")return unlock();
    if(state==="hit")setLevel(lvl+1);
    msg.hidden=true;cur=null;state="aim";hud();
  });
  bEnter.addEventListener("click",unlock);
  $("#gSkip").addEventListener("click",unlock);
  fire.addEventListener("click",launch);
  angI.addEventListener("input",hud);powI.addEventListener("input",hud);
  addEventListener("keydown",e=>{
    if(gate.hidden||state!=="aim")return;
    if(e.target.tagName==="INPUT")return e.key===" "?(e.preventDefault(),launch()):undefined;
    if(e.key===" "&&e.target.tagName!=="BUTTON"){e.preventDefault();launch();}
    const k={ArrowUp:[angI,1],ArrowDown:[angI,-1],ArrowRight:[powI,2],ArrowLeft:[powI,-2]}[e.key];
    if(k){e.preventDefault();k[0].value=+k[0].value+k[1];hud();}
  });
  // arrastar para trás, como uma fisga
  cv.addEventListener("pointerdown",e=>{if(state!=="aim")return;drag={x:e.clientX,y:e.clientY,moved:false};cv.setPointerCapture(e.pointerId);});
  cv.addEventListener("pointermove",e=>{
    if(!drag)return;const dx=drag.x-e.clientX,dy=e.clientY-drag.y,len=Math.hypot(dx,dy);
    if(len<12)return;drag.moved=true;
    angI.value=Math.round(Math.max(10,Math.min(80,Math.atan2(dy,dx)*180/Math.PI)));
    powI.value=Math.round(Math.max(0,Math.min(100,len/(cv.clientWidth*.3)*100)));hud();
  });
  cv.addEventListener("pointerup",()=>{if(drag&&drag.moved)launch();drag=null;});
  cv.addEventListener("pointercancel",()=>drag=null);
  addEventListener("resize",()=>{if(!gate.hidden)size();});

  setLevel(0);size();hud();raf=requestAnimationFrame(loop);
  listeners.push(()=>{paint();fb.textContent="";});
  show("intro");
})();


renderAll();
</script>

</body></html>
